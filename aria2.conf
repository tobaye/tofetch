# ToFetch's aria2 settings. server.py passes the RPC options itself;
# this file carries the download behaviour. Edit freely - it is yours.
# Reference: https://aria2.github.io/manual/en/html/aria2c.html#options

# Connections per server / split download
max-connection-per-server=8
split=8
min-split-size=1M

# BitTorrent
enable-dht=true
enable-peer-exchange=true
bt-enable-lpd=false
listen-port=51413
dht-listen-port=51413
bt-max-peers=80
# Seed until ratio 1.0, then stop (set 0 to seed forever)
seed-ratio=1.0

# Trackers help magnet links find peers faster; refresh the list if it goes stale.
bt-tracker=udp://tracker.opentrackr.org:1337/announce,udp://open.stealth.si:80/announce,udp://tracker.torrent.eu.org:451/announce,udp://exodus.desync.com:6969/announce

# Be polite and identifiable
user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36

# Robustness
retry-wait=3
max-tries=5
timeout=30
connect-timeout=15
summary-interval=0
