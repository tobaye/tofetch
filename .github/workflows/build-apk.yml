name: build-apk

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'server.py'
      - 'static/**'
      - 'aria2.conf'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Stage python payload (single source of truth = repo root)
        run: |
          cp server.py aria2.conf android/app/src/main/python/
          cp -r static android/app/src/main/python/

      - name: Fetch aria2 engines (Aria2 Next v3.1.0, checksums pinned)
        run: |
          base=https://github.com/AnInsomniacy/aria2-next/releases/download/v3.1.0
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/x86_64
          curl -fsSL -o /tmp/a64 "$base/aria2-next-3.1.0-android-arm64"
          echo "7e4ce96d2e29bf4f1dff0f0d0bc737488883cc6791c1795208f7f634994c80e3  /tmp/a64" | sha256sum -c -
          cp /tmp/a64 android/app/src/main/jniLibs/arm64-v8a/libaria2c.so
          # x86_64: our own NDK static build, published by the
          # build-aria2-x86_64 workflow to the "engines" release. If it is
          # not there yet, ship arm64-only instead of the old glibc
          # placeholder that could never run on Android.
          if curl -fsSL -o /tmp/x64 https://github.com/tobaye/tofetch/releases/download/engines/aria2-x86_64-android; then
            file /tmp/x64
            cp /tmp/x64 android/app/src/main/jniLibs/x86_64/libaria2c.so
          else
            echo "no x86_64 engine asset; building arm64-only APK"
            rmdir android/app/src/main/jniLibs/x86_64
            sed -i "s/abiFilters 'arm64-v8a', 'x86_64'/abiFilters 'arm64-v8a'/" android/app/build.gradle
          fi

      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.TOFETCH_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/tofetch-release.p12
            echo "keystore restored ($(stat -c%s android/tofetch-release.p12) bytes)"
          else
            echo "::error::TOFETCH_KEYSTORE_B64 secret is not set"
            exit 1
          fi

      - name: Build APK (release-signed, permanent keystore)
        working-directory: android
        env:
          TOFETCH_KEYSTORE: ${{ github.workspace }}/android/tofetch-release.p12
          TOFETCH_KEY_ALIAS: ${{ secrets.TOFETCH_KEY_ALIAS }}
          TOFETCH_STORE_PASS: ${{ secrets.TOFETCH_STORE_PASS }}
          TOFETCH_KEY_PASS: ${{ secrets.TOFETCH_KEY_PASS }}
        run: gradle assembleRelease --stacktrace

      -- name: Attach APK to the release
  env:
    GH_TOKEN: ${{ github.token }}
  run: |
    apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
    echo "built: $apk"
    cp "$apk" ToFetch-Android.apk
    ver=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
    tag="v$ver"
    gh release upload "$tag" ToFetch-Android.apk --clobber || \
      gh release create "$tag" --title "ToFetch $ver" \
        --notes "ToFetch $ver - a tiny self-hosted download manager (aria2 engine, zero-dependency Python core, single-file web UI). Android APK (release-signed with the permanent keystore), plus server / Windows / Linux / Termux packages." \
        ToFetch-Android.apk
