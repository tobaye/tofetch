name: docker

# Build the server image and push it to GHCR as
# ghcr.io/tobaye/tofetch:<tag> and :latest. Runs when a release is
# published, or manually with a tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (usually the release tag)"
        required: true
        default: "v1.3.0"

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tobaye/tofetch:${{ github.event.release.tag_name || inputs.tag }}
            ghcr.io/tobaye/tofetch:latest
