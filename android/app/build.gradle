plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'eu.org.puke.tofetch'
    compileSdk 34

    defaultConfig {
        applicationId 'eu.org.puke.tofetch'
        minSdk 26
        targetSdk 34
        versionCode 20
        versionName '1.5.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    signingConfigs {
        release {
            // Permanent release keystore, restored by CI from repo
            // secrets (TOFETCH_KEYSTORE_B64). Env-driven so no credential
            // ever lands in the repo.
            storeFile file(System.getenv("TOFETCH_KEYSTORE") ?: "../tofetch-release.p12")
            storePassword System.getenv("TOFETCH_STORE_PASS")
            keyAlias System.getenv("TOFETCH_KEY_ALIAS") ?: "tofetch"
            keyPassword System.getenv("TOFETCH_KEY_PASS")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    packaging {
        jniLibs {
            // The aria2 engine is executed as a standalone binary from
            // nativeLibraryDir, so the .so files must be extracted to real
            // files at install time, not kept compressed inside the APK.
            useLegacyPackaging = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

chaquopy {
    defaultConfig {
        version '3.12'
        buildPython 'python3'
    }
}
